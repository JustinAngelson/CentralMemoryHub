services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CMH_POSTGRES_PASSWORD:?Set a URL-safe generated database password}
      POSTGRES_DB: cmh_v2_dev
    volumes:
      - cmh-v2-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cmh_v2_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      CMH_ADMIN_DATABASE_URL: postgresql://postgres:${CMH_POSTGRES_PASSWORD}@postgres:5432/cmh_v2_dev
      CMH_DATABASE_URL: postgresql+psycopg://cmh_app:${CMH_APP_PASSWORD:?Set the runtime password}@postgres:5432/cmh_v2_dev
      CMH_MIGRATE_DATABASE_URL: postgresql+psycopg://cmh_migrate:${CMH_MIGRATE_PASSWORD:?Set the migration password}@postgres:5432/cmh_v2_dev
      CMH_PUBLIC_URL: http://localhost:8080
      CMH_ALLOWED_HOSTS: app
      CMH_ENV: dev
      CMH_EMBEDDING_PROVIDER: ${CMH_EMBEDDING_PROVIDER:-openai}
      CMH_EMBEDDING_API_KEY: ${CMH_EMBEDDING_API_KEY:-}
      CMH_BOOTSTRAP_TOKEN: ${CMH_BOOTSTRAP_TOKEN:?Set a 64+ character bootstrap token}
    command: >-
      sh -c "python v2/init_database.py &&
      alembic -c v2/alembic.ini upgrade head && python -m cmh.seed &&
      uvicorn cmh.app:create_app --factory --host 0.0.0.0 --port 8080 --no-access-log"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  cmh-v2-postgres:
